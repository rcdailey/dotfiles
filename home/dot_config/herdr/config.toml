onboarding = false

[theme]
name = "dracula"

[session]
resume_agents_on_restore = true

[ui]
confirm_close = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
# Window title tokens cannot read pane metadata, so OpenCode panes keep their "OC | " prefix
window_title = "{workspace}: {terminal_title}"

# $issue and $title come from the OpenCode herdr-session-title plugin. The tab shows only once
# renamed; the rule hides herdr's numeric default names.
[ui.sidebar.agents.rows_by_agent]
opencode = [
  [
    "state_icon",
    "workspace",
    { token = "$issue", bold = true },
    { token = "tab", rules = [{ gt = -1, hide = true }] },
  ],
  ["$title"],
]

[ui.toast]
delivery = "terminal"

# OpenCode shows its own copy toast; herdr would repeat it when relaying OpenCode's OSC 52 copy
[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false

# Keybindings: direct shortcuts keep the former kitty-native split/tab muscle memory.
# Prefix moved off the default ctrl+b so it passes through to OpenCode (background task);
# herdr cannot unbind the prefix entirely.
[keys]
prefix = "ctrl+space"

# Pane focus
focus_pane_left = ["prefix+h", "ctrl+shift+left"]
focus_pane_right = ["prefix+l", "ctrl+shift+right"]
focus_pane_up = ["prefix+k", "ctrl+shift+up"]
focus_pane_down = ["prefix+j", "ctrl+shift+down"]

# Pane management
close_pane = ["prefix+x", "ctrl+shift+w"]
zoom = ["prefix+z", "ctrl+shift+z"]

resize_pane_left = "ctrl+alt+left"
resize_pane_right = "ctrl+alt+right"
resize_pane_up = "ctrl+alt+up"
resize_pane_down = "ctrl+alt+down"

goto = ["prefix+g", "ctrl+shift+k"]

# Tabs
new_tab = "prefix+c"
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
rename_tab = ["prefix+shift+t", "f2"]
close_tab = ["prefix+shift+x", "ctrl+shift+q"]

# Agent tab: a new tab running OpenCode; prefix+c opens a plain shell tab instead
[[keys.command]]
key = "ctrl+shift+t"
type = "shell"
description = "new agent tab"
command = 'herdr pane run "$(herdr tab create --focus | jq -r .result.root_pane.pane_id)" opencode'

# Splits start in herdr-pane-dir: an OpenCode pane's session directory (for
# example its worktree), otherwise the pane's cwd. The built-in splits use only the pane's cwd.
[[keys.command]]
key = ["prefix+minus", "ctrl+shift+e"]
type = "shell"
description = "split down"
command = 'herdr pane split --direction down --cwd "$(herdr-pane-dir)" --focus'

[[keys.command]]
key = ["prefix+v", "ctrl+shift+o"]
type = "shell"
description = "split right"
command = 'herdr pane split --direction right --cwd "$(herdr-pane-dir)" --focus'
