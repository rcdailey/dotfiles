[tools]
age = "latest"
cosign = "latest"
d2 = "latest"
delta = "latest"
fzf = "latest"
git-filter-repo = "latest"
gh = "latest"
jq = "latest"
lazygit = "latest"
lsd = "latest"
markdownlint-cli2 = "latest"
powershell = "latest"
pre-commit = "latest"
rclone = "latest"
ripgrep = "latest"
slsa-verifier = "latest"
task = "latest"
uv = "latest"
worktrunk = "latest"
yamllint = "latest"
yq = "latest"
zizmor = "latest"
"github:byteowlz/sx" = "latest"
node = "latest"
bun = "latest"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
"npm:ctx7" = "latest"
topgrade = "latest"

# Don't use this because it doesn't update frequently enough
# Use: curl -fsSL https://opencode.ai/install | bash
# opencode = "latest"

[settings]
# both must be off so hook-env strips the shims dir from interactive PATH
# (src/path_env.rs); shims list every installed tool, active or not, which
# breaks PATH-based tool discovery (topgrade, editors) outside project dirs.
# non-interactive shells still get shims via .zshenv (mise activate --shims).
activate_aggressive = false
not_found_auto_install = false
auto_install = true
jobs = 4
trusted_config_paths = ["~/.config/mise", "~"]
experimental = true
env_file = ".env"
netrc = false
node.verify = false

[settings.github]
credential_command = "gh auth token"

[env]
_.source = ["~/.config/mise/scripts/node-path.sh"]
OPENCODE_EXPERIMENTAL_LSP_TOOL = "1"

[hooks]
cd = "mise current 2>/dev/null | head -5 || true"
