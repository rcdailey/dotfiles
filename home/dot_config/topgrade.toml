# Topgrade configuration
# Reference: topgrade --config-reference

[misc]
assume_yes = true
cleanup = true

# cache sudo credentials at start and refresh during the run,
# so long runs prompt for the password exactly once
pre_sudo = true
sudo_loop = true

# every brew invocation runs `sudo --reset-timestamp` (brew.sh), wiping the
# cached credentials; run brew last so sudo-needing steps (dnf, snap,
# firmware) finish while the cache is still warm
last = ["brew_formula", "brew_cask"]

# topgrade itself is managed by mise
no_self_update = true

disable = [
  # pulls every local docker image, including pinned versions and test tags
  "containers",
  # managed by mise; self-update fails on mise-installed binary
  "uv",
  # python is mise-managed; user-site pip upgrade is pointless
  "pip3",
  # runs `git pull` + apply on the dotfiles repo; risky with in-progress work
  "chezmoi",
  # topgrade's zinit step re-sources .zshrc, tripping the re-source guard;
  # replaced by the custom "zinit" command below
  "shell",
]

[linux]
# refresh repository metadata before staging packages for an offline reboot
dnf_arguments = "--offline --refresh"

# `-i ` prefix runs in an interactive $SHELL, which loads .zshrc once
# (no explicit re-source, unlike topgrade's built-in zinit step)
[commands]
"zinit" = "-i zinit self-update && zinit update --all"
"prepare DNF offline update" = """
offline_dir=/usr/lib/sysimage/libdnf5/offline
if test -f "$offline_dir/transaction.json"; then
  sudo env DNF_SYSTEM_UPGRADE_NO_REBOOT=1 /usr/bin/dnf offline reboot -y
fi
"""
