skip-commit-generation-prompt = true

[merge]
squash = false

# Inside herdr, open the worktree as a child space running OpenCode (or focus it if open)
[post-switch]
herdr = 'herdr-worktree-open {{ repo_path }} {{ worktree_path }}'

# Inside herdr, close the removed worktree's child space (wt remove or wt merge)
[post-remove]
herdr = 'herdr-worktree-close {{ worktree_path }}'

[projects]
