# zsh plugins, sourced directly by ~/.config/zsh/04-plugins.sh. `chezmoi apply` clones missing
# repos and pulls at most once per refreshPeriod; 04-plugins.sh recompiles changed files.

[powerlevel10k]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
    pull.args = ["--ff-only"]

