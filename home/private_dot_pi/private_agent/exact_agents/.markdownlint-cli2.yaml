config:
  # TODO: Remove once rumdl merges nested .markdownlint-cli2.* configs with their parents
  # (https://github.com/rvben/rumdl/issues/941); until then rumdl ignores the root settings.
  line-length:
    line_length: 100
    code_blocks: false
    tables: false
  no-space-in-code: false
  # Agent bodies are system prompts, not documents; they start with prose.
  first-line-heading: false
