[project]
name = "acceptance-snapshot"
version = "0.1.0"
description = "Capture and compare acceptance audit iterations"
requires-python = ">=3.13"
dependencies = ["click>=8.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acceptance_snapshot"]
