[project]
name = "mdwrap"
version = "0.1.0"
description = "Reflow Markdown and MDX prose to the repository's configured line length"
requires-python = ">=3.13"
dependencies = ["click>=8.5", "editorconfig>=0.17", "json5>=0.15", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
# editorconfig 0.17 calls codecs.open, which Python 3.14 deprecates.
filterwarnings = ["ignore:codecs.open:DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdwrap"]
