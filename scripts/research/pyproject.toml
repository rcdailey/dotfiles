[project]
name = "research"
version = "0.1.0"
description = "LLM-optimized research CLI for web, GitHub repos, and PDFs"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "tavily-python>=0.8.0",
    "diskcache>=5.6.3",
    "trafilatura>=2.2.0",
    "curl-cffi>=0.16.3",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research"]
